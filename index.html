<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🗺️ Dashboard DROM‑COM</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI',system-ui,sans-serif; background:#f0f2f5; }
    #map { height:100vh; width:100%; }
    #controls {
      position:absolute; top:20px; right:20px; z-index:1000;
      background:rgba(255,255,255,0.96); padding:18px 22px; border-radius:14px;
      box-shadow:0 8px 30px rgba(0,0,0,0.22); min-width:220px;
      max-height:92vh; overflow-y:auto;
    }
    #controls label {
      display:block; font-weight:700; color:#1a3b5d;
      font-size:0.75rem; text-transform:uppercase; letter-spacing:0.6px;
      margin:12px 0 4px 0;
    }
    #controls label:first-of-type { margin-top:0; }
    #controls select {
      width:100%; padding:8px 12px; border-radius:8px;
      border:1px solid #d0d7de; font-size:0.9rem;
      background:#fafbfc;
    }
    .ctrl-hint { font-size:0.7rem; color:#6b7a8a; margin-top:2px; }
    .ctrl-divider { border:none; border-top:1px solid #e9edf2; margin:12px 0; }
    #legend-container {
      position:absolute; bottom:30px; right:20px; z-index:1000;
      background:rgba(255,255,255,0.95); padding:14px 18px; border-radius:12px;
      box-shadow:0 4px 20px rgba(0,0,0,0.13); border-left:5px solid #2a6f97;
      display:none; font-size:0.82rem; max-height:55vh; overflow-y:auto;
      min-width:140px;
    }
    #legend-container h4 { margin:0 0 8px 0; font-size:0.85rem; color:#1a3b5d; }
    .legend-item { display:flex; align-items:center; gap:10px; margin:4px 0; }
    .color-box { width:20px; height:20px; border-radius:4px; border:1px solid #bbb; flex-shrink:0; }
    #loading {
      position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
      z-index:2000; background:rgba(0,0,0,0.78); color:#fff;
      padding:20px 40px; border-radius:60px; display:flex;
      align-items:center; gap:18px; font-size:1.1rem;
      backdrop-filter:blur(4px);
    }
    .spinner {
      width:24px; height:24px; border:3px solid rgba(255,255,255,0.25);
      border-top:3px solid #fff; border-radius:50%;
      animation:spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    #error-msg {
      position:absolute; top:80px; left:50%; transform:translateX(-50%);
      z-index:1500; background:#dc3545; color:#fff;
      padding:12px 28px; border-radius:10px; display:none;
      text-align:center; max-width:85%; box-shadow:0 6px 18px rgba(0,0,0,0.2);
      font-weight:500;
    }
    .leaflet-popup-content { font-size:0.85rem; min-width:220px; max-width:300px; }
    .popup-title { font-weight:700; font-size:1.1rem; color:#1a3b5d; border-bottom:2px solid #e0e7ef; padding-bottom:4px; margin-bottom:8px; }
    .popup-row { display:flex; justify-content:space-between; padding:2px 0; gap:12px; }
    .popup-row .label { color:#4a5d6e; }
    .popup-row .value { font-weight:600; color:#0b2a41; text-align:right; }
    .badge-typologie {
      display:inline-block; padding:2px 12px; border-radius:20px;
      font-size:0.7rem; font-weight:600; background:#eef3f7;
      color:#1a3b5d; margin-top:4px;
    }
    @media (max-width:640px) {
      #controls { top:10px; right:10px; min-width:160px; padding:12px 14px; }
      #legend-container { bottom:10px; right:10px; font-size:0.7rem; padding:10px 12px; max-width:180px; }
      .leaflet-popup-content { min-width:160px; font-size:0.75rem; }
    }
  </style>
</head>
<body>
  <div id="loading"><div class="spinner"></div><span>Chargement des données…</span></div>
  <div id="error-msg"></div>
  <div id="map"></div>

  <div id="controls">
    <label for="depSelect">🗺️ Département</label>
    <select id="depSelect">
      <option value="971">971 – Guadeloupe</option>
      <option value="972" selected>972 – Martinique</option>
      <option value="973">973 – Guyane</option>
      <option value="974">974 – La Réunion</option>
      <option value="976">976 – Mayotte</option>
    </select>

    <label for="communeSelect">🏘️ Commune</label>
    <select id="communeSelect">
      <option value="">Sélectionnez un département d'abord</option>
    </select>
    <div class="ctrl-hint">Choisissez une commune pour afficher ses parcelles</div>

    <hr class="ctrl-divider" />

    <label for="parcelleFilter">📌 Filtrer parcelles par typologie</label>
    <select id="parcelleFilter">
      <option value="all">Toutes les typologies</option>
      <option value="PRIVE">🏠 Privé</option>
      <option value="COMMUNE">🏛️ Commune</option>
      <option value="ETAT">🏢 État</option>
      <option value="TERRE COUTUMIERE">🌿 Terre coutumière</option>
      <option value="NON RENSEIGNE">❓ Non renseigné</option>
      <option value="MIXTE">🔀 Mixte</option>
    </select>
    <div class="ctrl-hint">Cliquez sur une parcelle pour voir ses infos</div>

    <hr class="ctrl-divider" />

    <div class="ctrl-hint" style="margin-top:6px;">
      <span id="parcelleCount" style="font-weight:600;">0</span> parcelles affichées
    </div>
  </div>

  <div id="legend-container">
    <h4 id="legend-title">Typologie des parcelles</h4>
    <div id="legend-items"></div>
  </div>

  <script>
    // ============================================================
    // 1. CONFIGURATION
    // ============================================================
    const COMMUNES_PATH = 'data/';
    const PARCELLES_BASE = 'data/communes_';

    // ============================================================
    // 2. CARTE
    // ============================================================
    const map = L.map('map', { center: [14.6, -61.0], zoom: 9, zoomControl: true });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap', maxZoom: 19 }).addTo(map);
    const cadastre = L.tileLayer.wms('https://carto.gouv.nc/arcgis/services/plan_parcellaire_informatise/MapServer/WMSServer?', { layers: '0', format: 'image/png', transparent: true, attribution: '&copy; Cadastre', opacity: 0.5, maxZoom: 18 });
    L.control.layers(
      { 'OpenStreetMap': L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap', maxZoom: 19 }) },
      { 'Fond cadastral (WMS)': cadastre }
    ).addTo(map);

    // ============================================================
    // 3. ÉTAT
    // ============================================================
    let communeLayer = null;
    let parcelleCluster = null;
    let allParcelles = [];
    let parcelleFilter = 'all';

    // ============================================================
    // 4. TYPOLOGIE (nettoyée)
    // ============================================================
    const TYPOLOGIE_COLORS = {
      'PRIVE': '#2e7d32',
      'COMMUNE': '#1565c0',
      'ETAT': '#f57f17',
      'ETAT FRANCAIS': '#f57f17',
      'TERRE COUTUMIERE': '#6a1b9a',
      'PUBLIQUE': '#1565c0',
      'MIXTE': '#f57f17',
      'NON RENSEIGNE': '#9e9e9e'
    };
    const TYPOLOGIE_LABELS = {
      'PRIVE': '🏠 Privé',
      'COMMUNE': '🏛️ Commune',
      'ETAT': '🏢 État',
      'ETAT FRANCAIS': '🏢 État français',
      'TERRE COUTUMIERE': '🌿 Terre coutumière',
      'PUBLIQUE': '🏛️ Publique',
      'MIXTE': '🔀 Mixte',
      'NON RENSEIGNE': '❓ Non renseigné'
    };

    // ============================================================
    // 5. UTILITAIRES
    // ============================================================
    function showError(msg) {
      document.getElementById('error-msg').textContent = '⚠️ ' + msg;
      document.getElementById('error-msg').style.display = 'block';
      document.getElementById('loading').style.display = 'none';
    }
    function hideLoading() { document.getElementById('loading').style.display = 'none'; }

    // ============================================================
    // 6. CHARGEMENT JSON
    // ============================================================
    async function fetchJSON(url) {
      try {
        console.log(`📥 Chargement : ${url}`);
        const resp = await fetch(url);
        if (!resp.ok) {
          console.warn(`❌ Échec : ${url} (status ${resp.status})`);
          return null;
        }
        return await resp.json();
      } catch (e) {
        console.warn(`❌ Erreur pour ${url} :`, e);
        return null;
      }
    }

    // ============================================================
    // 7. RENDU COMMUNES
    // ============================================================
    function renderCommunes(geojson) {
      if (communeLayer) map.removeLayer(communeLayer);
      if (!geojson || !geojson.features) return;
      communeLayer = L.geoJson(geojson, {
        style: { fillColor: '#d3d3d3', fillOpacity: 0.2, color: '#4a6a7a', weight: 1.5, dashArray: '3 3' },
        onEachFeature: (f, layer) => {
          const name = f.properties.nom_commune || f.properties.nom || f.properties.NAME || 'Commune';
          layer.bindTooltip(name, { sticky: true });
          layer.bindPopup(`<div style="font-weight:700;color:#1a3b5d;">${name}</div>`);
        }
      }).addTo(map);
      try { map.fitBounds(communeLayer.getBounds(), { padding: [20,20] }); } catch (_) {}
    }

    // ============================================================
    // 8. RENDU PARCELLES (universel)
    // ============================================================
    function getParcelPoint(feature) {
      const geom = feature.geometry;
      if (!geom) return null;
      if (geom.type === 'Point') {
        const coords = geom.coordinates;
        if (!coords || coords.length < 2) return null;
        return { lat: coords[1], lng: coords[0] };
      } else if (geom.type === 'Polygon') {
        const ring = geom.coordinates[0];
        if (!ring || ring.length === 0) return null;
        const first = ring[0];
        if (!first || first.length < 2) return null;
        return { lat: first[1], lng: first[0] };
      } else if (geom.type === 'MultiPolygon') {
        const poly = geom.coordinates[0];
        if (!poly || poly.length === 0) return null;
        const ring = poly[0];
        if (!ring || ring.length === 0) return null;
        const first = ring[0];
        if (!first || first.length < 2) return null;
        return { lat: first[1], lng: first[0] };
      }
      return null;
    }

    // Fonction de formatage de surface (supporte nombre en m² ou chaîne)
    function formatSurface(value) {
      if (value === undefined || value === null || value === '') return '0 ha';
      if (typeof value === 'number') {
        // Si c'est un nombre, on considère que c'est en mètres carrés (contenance)
        return (value / 10000).toFixed(2) + ' ha';
      }
      if (typeof value === 'string') {
        // Essayer de parser une chaîne du type "123ha 45a 67ca"
        const m = value.match(/(\d+)ha\s*(\d+)a\s*(\d+)ca/);
        if (m) {
          const ha = parseInt(m[1]) || 0;
          const a = parseInt(m[2]) || 0;
          const ca = parseInt(m[3]) || 0;
          return (ha + a/100 + ca/10000).toFixed(2) + ' ha';
        }
        // Sinon, essayer de convertir en nombre
        const num = parseFloat(value);
        if (!isNaN(num)) {
          return (num / 10000).toFixed(2) + ' ha';
        }
        return value;
      }
      return '0 ha';
    }

    function renderParcelles(geojson, filter) {
      if (parcelleCluster) { map.removeLayer(parcelleCluster); parcelleCluster = null; }
      const features = geojson?.features || [];
      console.log(`📊 Parcelles chargées : ${features.length}`);

      const filtered = filter === 'all'
        ? features
        : features.filter(f => {
            const typo = (f.properties.nature || f.properties.proprietaire_nature || f.properties.type || 'NON RENSEIGNE').toUpperCase();
            return typo === filter.toUpperCase();
          });

      document.getElementById('parcelleCount').textContent = filtered.length;
      if (filtered.length === 0) {
        parcelleCluster = L.markerClusterGroup({ chunkedLoading: true });
        return;
      }

      parcelleCluster = L.markerClusterGroup({
        chunkedLoading: true,
        maxClusterRadius: 40,
        spiderfyOnMaxZoom: true,
        showCoverageOnHover: false,
        zoomToBoundsOnClick: true,
      });

      const markers = [];
      filtered.forEach(f => {
        const point = getParcelPoint(f);
        if (!point) return;
        const { lat, lng } = point;

        if (typeof lat !== 'number' || typeof lng !== 'number' || !isFinite(lat) || !isFinite(lng)) {
          console.warn('Coordonnées invalides, parcelle ignorée', { lat, lng, id: f.id });
          return;
        }

        // Typologie
        const rawTypo = f.properties.nature || f.properties.proprietaire_nature || f.properties.type || 'NON RENSEIGNE';
        const typo = rawTypo.toUpperCase();
        const color = TYPOLOGIE_COLORS[typo] || '#9e9e9e';
        const label = TYPOLOGIE_LABELS[typo] || rawTypo || 'Non renseigné';

        const icon = L.divIcon({
          html: `<div style="width:12px;height:12px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,0.4);"></div>`,
          className: '',
          iconSize: [12,12],
          iconAnchor: [6,6]
        });

        // Récupération des attributs (avec fallback pour chaque département)
        const commune = f.properties.commune || f.properties.commune_code || 'Inconnue';
        const nic = f.properties.nic || f.properties.id || '—';
        const numLot = f.properties.num_lot || f.properties.numero || f.properties.lot || '—';
        const section = f.properties.section_cadastrale || f.properties.section || '—';
        const surface = formatSurface(f.properties.surface_cadastrale ?? f.properties.contenance);

        const popupContent = `<div>
          <div style="font-weight:700;font-size:1rem;color:#1a3b5d;">Commune ${commune}</div>
          <div class="popup-row"><span class="label">📍 NIC :</span> <span class="value">${nic}</span></div>
          <div class="popup-row"><span class="label">📋 Lot :</span> <span class="value">${numLot}</span></div>
          <div class="popup-row"><span class="label">📐 Section :</span> <span class="value">${section}</span></div>
          <div class="popup-row"><span class="label">📏 Surface :</span> <span class="value">${surface}</span></div>
          <div style="margin-top:4px;">
            <span class="badge-typologie" style="background:${color}22;color:${color};border:1px solid ${color};">
              ${label}
            </span>
          </div>
        </div>`;

        markers.push(L.marker([lat, lng], { icon }).bindPopup(popupContent, { maxWidth: 260 }));
      });

      parcelleCluster.addLayers(markers);
      map.addLayer(parcelleCluster);
      updateLegend();
    }

    function updateLegend() {
      const container = document.getElementById('legend-container');
      const items = document.getElementById('legend-items');
      container.style.display = 'block';
      let html = '';
      for (const [key, color] of Object.entries(TYPOLOGIE_COLORS)) {
        const label = TYPOLOGIE_LABELS[key] || key;
        html += `<div class="legend-item"><div class="color-box" style="background:${color};"></div><span>${label}</span></div>`;
      }
      items.innerHTML = html;
    }

    // ============================================================
    // 9. CHARGEMENT DU DÉPARTEMENT (communes + liste)
    // ============================================================
    async function loadDepartment(dep) {
      try {
        document.getElementById('loading').style.display = 'flex';
        document.getElementById('error-msg').style.display = 'none';

        const url = `${COMMUNES_PATH}communes-${dep}.geojson`;
        const communes = await fetchJSON(url);
        if (!communes) throw new Error(`Fichier ${url} introuvable.`);
        renderCommunes(communes);

        const select = document.getElementById('communeSelect');
        select.innerHTML = '<option value="">Sélectionnez une commune</option>';

        const communesList = communes.features
          .map(f => {
            const code = f.properties.code_com || f.properties.code_insee || f.properties.code || f.properties.commune_code;
            const nom = f.properties.nom_commune || f.properties.nom || f.properties.NAME || f.properties.commune || f.properties.ville;
            return { code, nom };
          })
          .filter(item => item.code && item.nom)
          .sort((a, b) => a.nom.localeCompare(b.nom));

        communesList.forEach(item => {
          const opt = document.createElement('option');
          opt.value = item.code;
          opt.textContent = item.nom;
          select.appendChild(opt);
        });

        select.value = '';
        if (parcelleCluster) { map.removeLayer(parcelleCluster); parcelleCluster = null; }
        document.getElementById('parcelleCount').textContent = 0;
        allParcelles = [];

        hideLoading();
      } catch (err) {
        showError(err.message);
        console.error(err);
      }
    }

    // ============================================================
    // 10. CHARGEMENT DES PARCELLES D'UNE COMMUNE
    // ============================================================
    async function loadParcellesForCommune(dep, codeCommune) {
      try {
        if (!codeCommune) {
          if (parcelleCluster) { map.removeLayer(parcelleCluster); parcelleCluster = null; }
          document.getElementById('parcelleCount').textContent = 0;
          allParcelles = [];
          return;
        }

        if (!codeCommune.startsWith(dep)) {
          showError(`La commune sélectionnée (${codeCommune}) n'appartient pas au département ${dep}.`);
          document.getElementById('communeSelect').value = '';
          if (parcelleCluster) { map.removeLayer(parcelleCluster); parcelleCluster = null; }
          document.getElementById('parcelleCount').textContent = 0;
          allParcelles = [];
          return;
        }

        document.getElementById('loading').style.display = 'flex';
        document.getElementById('error-msg').style.display = 'none';

        const filename = `parcelles-${codeCommune}.json`;
        const url = `${PARCELLES_BASE}${dep}/${filename}`;
        console.log(`📥 Chargement des parcelles : ${url}`);
        const parcelles = await fetchJSON(url);
        if (!parcelles) throw new Error(`Fichier ${url} introuvable.`);

        allParcelles = parcelles.features || [];
        renderParcelles(parcelles, parcelleFilter);

        hideLoading();
      } catch (err) {
        showError(err.message);
        console.error(err);
      }
    }

    // ============================================================
    // 11. ÉVÉNEMENTS
    // ============================================================
    document.getElementById('depSelect').addEventListener('change', function(e) {
      const dep = e.target.value;
      loadDepartment(dep);
    });

    document.getElementById('communeSelect').addEventListener('change', function(e) {
      const code = e.target.value;
      const dep = document.getElementById('depSelect').value;
      if (code) {
        loadParcellesForCommune(dep, code);
      } else {
        if (parcelleCluster) { map.removeLayer(parcelleCluster); parcelleCluster = null; }
        document.getElementById('parcelleCount').textContent = 0;
        allParcelles = [];
      }
    });

    document.getElementById('parcelleFilter').addEventListener('change', function(e) {
      parcelleFilter = e.target.value;
      renderParcelles({ features: allParcelles }, parcelleFilter);
    });

    // ============================================================
    // 12. INIT
    // ============================================================
    loadDepartment('972');
  </script>
</body>
</html>
